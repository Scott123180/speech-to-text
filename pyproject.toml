[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-to-text"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "sounddevice>=0.4",
    "scipy>=1.11",
    "faster-whisper>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# NVIDIA GPU acceleration (CUDA 12). Install with: pip install -e ".[cuda]"
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
